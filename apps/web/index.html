    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #1a1e26;
        --border: #2c3240;
        --accent: #60a5fa;
        --accent-dim: #60a5fa22;

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;

        color: var(--text);
        min-height: 100vh;
      }

    <div id="root"></div>
